<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>קול־שבור · Voice Bridge</title>
<style>
:root{
  --bg:#0b0f17; --panel:#141a26; --panel2:#1b2333; --line:#27324a;
  --txt:#e8edf7; --dim:#93a0ba; --accent:#5b8cff; --accent2:#38d39f;
  --warn:#ffb454; --err:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 40px}

header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--dim);margin-top:2px}
header .grow{flex:1}
.logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:19px}
#lang{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  font-family:inherit;font-size:13px;font-weight:700;padding:9px 13px;border-radius:10px;
  cursor:pointer;flex:0 0 auto;white-space:nowrap}
#lang:active{transform:scale(.96)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--panel);
  padding:6px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:14px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--dim);
  padding:13px 8px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;
  font-family:inherit;line-height:1.35;transition:.15s}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--dim);font-weight:600}

.btn{appearance:none;border:0;font-family:inherit;font-weight:700;cursor:pointer;
  border-radius:13px;padding:15px 18px;font-size:16px;background:var(--accent);color:#fff;
  width:100%;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.go{background:var(--accent2);color:#04231a;font-size:19px;padding:20px}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:11px;width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:120px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}

textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:12px;padding:13px;font-size:16px;font-family:inherit;resize:vertical;
  min-height:110px;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

.out{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;
  font-size:26px;line-height:1.65;white-space:pre-wrap;
  word-break:break-word;min-height:70px;font-weight:500}
.out.src{font-size:15px;color:var(--dim);font-weight:400;line-height:1.55}
.out:empty::before{content:"—";color:var(--dim)}

.status{font-size:13px;color:var(--dim);margin:10px 0;min-height:19px;line-height:1.5}
.status.err{color:var(--err)} .status.ok{color:var(--accent2)} .status.warn{color:var(--warn)}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:9px 0;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s;border-radius:99px}

.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;
  color:var(--dim);font-size:15px;cursor:pointer;transition:.15s;line-height:1.6}
.drop:hover,.drop.hot{border-color:var(--accent);color:var(--txt);background:rgba(91,140,255,.06)}
.drop b{display:block;color:var(--txt);font-size:16px;margin-bottom:5px}
.drop .file{color:var(--accent2);font-weight:600;direction:ltr;display:inline-block}

label.fld{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 6px;font-weight:600}
select,input[type=range]{width:100%;background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:11px;padding:11px;font-size:15px;font-family:inherit}
input[type=range]{padding:0;height:32px;accent-color:var(--accent)}

details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:0 16px;margin-bottom:12px}
details summary{cursor:pointer;padding:15px 0;font-size:14px;font-weight:600;color:var(--dim);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾";transition:.2s}
details[open] summary::after{transform:rotate(180deg)}
details .in{padding-bottom:16px}

.pill{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin:0 5px}
.pill.ok{color:var(--accent2);border-color:rgba(56,211,159,.35)}
.hide{display:none!important}
.note{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px}
footer{text-align:center;color:var(--dim);font-size:11.5px;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">🎧</div>
  <div class="grow">
    <h1 data-t="appName">קול־שבור</h1>
    <div class="sub" data-t="appSub"></div>
  </div>
  <button id="lang" onclick="toggleLang()">English</button>
</header>

<div class="tabs">
  <button id="tabA" class="on" onclick="setTab('A')"><span data-t="tabA"></span><small data-t="tabAsub"></small></button>
  <button id="tabB" onclick="setTab('B')"><span data-t="tabB"></span><small data-t="tabBsub"></small></button>
</div>

<section id="paneA">
  <div class="card">
    <h2 data-t="a1"></h2>
    <div class="drop" id="drop" onclick="fileIn.click()">
      <b data-t="dropTitle"></b>
      <span data-t="dropHint"></span><br>
      <span style="font-size:12.5px;opacity:.75">m4a · mp3 · ogg · opus · wav · caf · webm</span>
      <div id="fname" class="file" style="margin-top:9px"></div>
    </div>
    <input type="file" id="fileIn" accept="audio/*,video/mp4,.opus,.ogg,.m4a,.caf,.amr" class="hide">
    <audio id="player" controls class="hide" style="width:100%;margin-top:11px"></audio>
  </div>

  <div class="card">
    <h2 data-t="a2"></h2>
    <label class="fld" data-t="showResultIn"></label>
    <select id="aOut" onchange="syncA()">
      <option value="he">🇮🇱 <span></span></option>
      <option value="en">🇺🇸 <span></span></option>
    </select>
    <div class="note" data-t="englishOnly"></div>
    <div class="note hide" id="iosTip" data-t="iosTip"></div>
    <div class="note hide" id="shareTip" data-t="shareTip"></div>
    <button class="btn go" id="runA" onclick="goA()" disabled style="margin-top:14px"></button>
    <div class="bar" id="barA"><i></i></div>
    <div class="status" id="stA"></div>
  </div>

  <div class="card">
    <h2 id="outAHead"></h2>
    <div class="out" id="outA"></div>
    <div class="row" style="margin-top:11px">
      <button class="btn sec sm" onclick="copy(outA.textContent)" data-t="btnCopy"></button>
      <button class="btn sec sm" onclick="unlockAudio();speak(outA.textContent, aOut.value)" data-t="btnSpeak"></button>
      <button class="btn sec sm" onclick="stopSpeak()" data-t="btnStop"></button>
    </div>
  </div>

  <details>
    <summary id="srcAHead"></summary>
    <div class="in"><div class="out src" id="srcA"></div></div>
  </details>
</section>

<section id="paneB" class="hide">
  <button class="btn go" id="clipBtn" data-t="clipRead" onclick="clipSpeak()"
          style="font-size:22px;padding:26px;margin-bottom:12px"></button>

  <div class="card">
    <h2 data-t="b1"></h2>
    <textarea id="txtB" oninput="syncB()"></textarea>
    <div class="row" style="margin-top:9px">
      <button class="btn sec sm" onclick="pasteB()" data-t="btnPaste"></button>
      <button class="btn sec sm" onclick="txtB.value='';syncB();outB.textContent=''" data-t="btnClear"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="b2"></h2>
    <div class="pair">
      <div>
        <label class="fld" data-t="textLang"></label>
        <select id="bSrc" onchange="syncB()">
          <option value="auto">🌐 <span></span></option>
          <option value="en">🇺🇸 <span></span></option>
          <option value="he">🇮🇱 <span></span></option>
        </select>
      </div>
      <div>
        <label class="fld" data-t="speakIn"></label>
        <select id="bOut" onchange="syncB();loadVoices()">
          <option value="he">🇮🇱 <span></span></option>
          <option value="en">🇺🇸 <span></span></option>
        </select>
      </div>
    </div>
    <button class="btn go" id="runB" onclick="goB()" disabled style="margin-top:14px"></button>
    <div class="status" id="stB"></div>

    <label class="fld"><span data-t="speed"></span> · <span id="rateV">1.0</span>×</label>
    <input type="range" id="rate" min="0.6" max="1.8" step="0.1" value="1"
           oninput="rateV.textContent=(+this.value).toFixed(1)">
    <label class="fld" data-t="voiceSource"></label>
    <select id="vsrc">
      <option value="auto"></option>
      <option value="online"></option>
      <option value="device"></option>
    </select>
    <label class="fld" data-t="deviceVoice"></label>
    <select id="voice"></select>
    <div class="row" style="margin-top:11px">
      <button class="btn sec sm" onclick="unlockAudio();speak(outB.textContent, bOut.value)" data-t="btnAgain"></button>
      <button class="btn sec sm" onclick="stopSpeak()" data-t="btnStop"></button>
      <button class="btn sec sm" onclick="testVoice()" data-t="btnTestVoice"></button>
    </div>
  </div>

  <button class="btn go hide" id="bigPlay" data-t="bigPlay" style="font-size:26px;padding:30px;margin-bottom:12px"
          onclick="bigPlayTap()"></button>

  <div class="card">
    <h2 id="outBHead"></h2>
    <div class="out" id="outB"></div>
  </div>
</section>

<details>
  <summary><span data-t="settings"></span> <span id="diag"></span></summary>
  <div class="in">
    <label class="fld" data-t="modelLabel"></label>
    <select id="model">
      <option value="Xenova/whisper-tiny.en"></option>
      <option value="Xenova/whisper-base.en" selected></option>
      <option value="Xenova/whisper-small.en"></option>
    </select>

    <label class="fld" data-t="engineLabel"></label>
    <select id="engine">
      <option value="auto"></option>
      <option value="builtin"></option>
      <option value="google">Google</option>
      <option value="mymemory">MyMemory</option>
      <option value="lingva">Lingva</option>
    </select>

    <div class="note" id="caps"></div>
    <div class="row" style="margin-top:11px">
      <button class="btn sec sm" onclick="runDiag()" data-t="btnCheck"></button>
      <button class="btn sec sm" onclick="preload()" data-t="btnPreload"></button>
    </div>
    <div class="status" id="stD"></div>
    <div class="note" data-t="modelNote"></div>
  </div>
</details>

<footer data-t="footer"></footer>
</div>

<script type="module">
